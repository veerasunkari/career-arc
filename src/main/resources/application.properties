spring.application.name=career-arc
server.address=127.0.0.1
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:mysql://127.0.0.1:3306/career_arc_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.serialization.write-dates-as-timestamps=false
app.demo-seed=${APP_DEMO_SEED:true}
app.auth.jwt-secret=${JWT_SECRET:}
app.auth.cookie-secure=${JWT_COOKIE_SECURE:false}
career.match.weights.skill=${CAREER_MATCH_SKILL_WEIGHT:55}
career.match.weights.assessment=${CAREER_MATCH_ASSESSMENT_WEIGHT:25}
career.match.weights.interest=${CAREER_MATCH_INTEREST_WEIGHT:15}
career.match.weights.academic=${CAREER_MATCH_ACADEMIC_WEIGHT:5}